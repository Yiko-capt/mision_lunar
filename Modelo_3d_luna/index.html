<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelo 3D de la Luna</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02040a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #ui { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 2; }
  button { background: rgba(20,28,45,.85); color: #e8ecf1; border: 1px solid #2b3a5c;
    padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button:hover { background: rgba(40,56,90,.95); }
  #credit { position: fixed; bottom: 10px; left: 12px; color: #6b7a90; font-size: 11px; z-index: 2; }
  #err { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #f87171;
    display: none; text-align: center; font-size: 14px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="ui">
  <button id="spin">⏸ Pausar rotación</button>
  <button id="reset">🔄 Resetear vista</button>
</div>
<div id="err">No se pudo cargar moon_texture.jpg.<br>Abre esta página con un servidor local o GitHub Pages (no con doble clic).</div>
<div id="credit">Textura: NASA / LRO / LROC (ASU), vía Quickmap · Solo la cara visible tiene datos</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 1000);
const HOME = new THREE.Vector3(0, 0.4, 3.6);
camera.position.copy(HOME);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 1.3;
controls.maxDistance = 10;

// Estrellas
{
  const N = 2000, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 60 + Math.random() * 40, t = Math.random() * 6.2832, p = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(p) * Math.cos(t), r * Math.sin(p) * Math.sin(t), r * Math.cos(p)], 3 * i);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xaab3c5, size: 0.1, transparent: true, opacity: .8 })));
}

// Luna
const material = new THREE.MeshStandardMaterial({ color: 0x8a8f99, roughness: 0.95, metalness: 0 });
const moon = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 96), material);
// La textura tiene la cara visible (lon 0°) hacia +X; la giramos para que mire a la cámara.
const START_ROT = -Math.PI / 2;
moon.rotation.y = START_ROT;
scene.add(moon);

new THREE.TextureLoader().load('moon_texture.jpg',
  (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    material.map = tex; material.color.setHex(0xffffff); material.needsUpdate = true;
  },
  undefined,
  () => { document.getElementById('err').style.display = 'block'; }
);

// Luz fija tipo "Luna llena" + algo de luz ambiente
scene.add(new THREE.AmbientLight(0x3a4560, 1.2));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.4);
sun.position.set(4, 1.5, 5);
scene.add(sun);

// Botones
let spinning = true;
const spinBtn = document.getElementById('spin');
spinBtn.onclick = () => {
  spinning = !spinning;
  spinBtn.textContent = spinning ? '⏸ Pausar rotación' : '▶ Reanudar rotación';
};
document.getElementById('reset').onclick = () => {
  moon.rotation.set(0, START_ROT, 0); camera.position.copy(HOME); controls.target.set(0, 0, 0); controls.update();
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop() {
  if (spinning) moon.rotation.y += 0.0025;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();

window.moon3d = { moon, camera, controls, scene };
</script>
</body>
</html>
